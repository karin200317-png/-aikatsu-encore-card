<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6fae"><title>アイカツ！アンコール カードコレクション</title>
<style>
:root{--p:#ff69a8;--p2:#fff0f7;--ink:#3d3040;--muted:#907f8d;--line:#eadfe7;--bg:#fffafd}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff2f8 0,#fffafd 260px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head{max-width:1200px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;font-size:20px}.sub{font-size:11px;color:var(--muted);margin-top:2px}
main{max-width:1200px;margin:auto;padding:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 14px;box-shadow:0 7px 24px #d9bfd01f}.stat b{font-size:24px}.stat span{display:block;color:var(--muted);font-size:11px}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;margin:13px 0}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:13px;font-size:15px;outline:none}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.filters select,.actions button{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;color:var(--ink);font-weight:700}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.primary{background:var(--p)!important;color:#fff!important;border-color:var(--p)!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 7px 20px #cbb8c51c;cursor:pointer}.card.owned{outline:2px solid #ffb0ce}.pic{aspect-ratio:.70;background:radial-gradient(circle at 50% 25%,#fff,#f3e7ef);display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.ph{text-align:center;color:#c8b7c2;font-weight:900;font-size:12px}.info{padding:10px}.no{font-size:10px;color:var(--muted)}.name{font-weight:850;font-size:13px;line-height:1.35;margin:3px 0 8px}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{font-size:9px;padding:4px 7px;border-radius:99px;background:var(--p2)}.ownedmark{position:absolute;top:8px;right:8px;background:#ffffffe8;border-radius:99px;padding:5px 8px;font-size:11px;font-weight:900}
dialog{border:0;border-radius:21px;padding:0;width:min(540px,94vw);box-shadow:0 25px 80px #0003}dialog::backdrop{background:#24131f78}.modal{padding:20px}.modal h2{margin:0 0 12px}.form{display:grid;gap:9px}.form label{font-size:11px;font-weight:900}.form input,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.photoPreview{max-width:150px;max-height:200px;display:block;margin:5px auto;border-radius:10px}.foot{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.hint{font-size:11px;color:var(--muted);line-height:1.5}
.detailImgs{display:flex;gap:8px;justify-content:center}.detailImgs img{width:45%;max-height:280px;object-fit:contain;border-radius:10px;background:#f7eef4}
a.link{color:#d64f8d;font-weight:800}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.logo{font-size:17px}main{padding:11px}}
</style></head>
<body>
<header><div class="head"><div><div class="logo">🌸 アイカツ！アンコール</div><div class="sub">カードコレクション管理帳</div></div><button class="actions primary" onclick="openImport()">＋ カードを取り込む</button></div></header>
<main>
<div class="stats"><div class="stat"><b id="total"></b><span>登録カード</span></div><div class="stat"><b id="owned"></b><span>所持枚数</span></div><div class="stat"><b id="missing"></b><span>未所持カード</span></div><div class="stat"><b id="rate"></b><span>コンプリート率</span></div></div>
<section class="toolbar">
<input id="search" class="search" placeholder="🔍 カード番号・カード名を検索…" oninput="render()">
<div class="filters">
<select id="series" onchange="render()"><option value="">弾数：すべて</option><option>1弾</option><option>プロモ</option></select>
<select id="type" onchange="render()"><option value="">タイプ：すべて</option><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option><option value="__">未設定</option></select>
<select id="brand" onchange="render()"><option value="">ブランド：すべて</option><option>ノーブランド</option><option>エンジェリーシュガー</option><option>フューチャリングガール</option><option>スパイシーアゲハ</option><option>ドリーミークラウン</option><option>メープルリボン</option><option value="__">未設定</option></select>
<select id="cat" onchange="render()"><option value="">カテゴリ：すべて</option><option>トップス</option><option>ボトムス</option><option>シューズ</option><option>トップス＆ボトムス</option><option>フルコーデ</option><option>アクセサリー</option><option value="__">未設定</option></select>
<select id="rarity" onchange="render()"><option value="">レア度：すべて</option><option>PR</option><option>R</option><option>N</option><option>ER</option></select>
<select id="ownedF" onchange="render()"><option value="">所持：すべて</option><option value="yes">所持</option><option value="no">未所持</option></select>
</div>
<div class="actions"><button onclick="sortBy('no')">番号順</button><button onclick="sortBy('rarity')">レア度順</button><button onclick="clearF()">絞り込み解除</button><button onclick="exportJSON()">バックアップ</button><a class="actions" style="margin:0" href="https://dcd.aikatsu.com/encore/cardlist/" target="_blank"><button type="button">公式カードリスト ↗</button></a></div>
</section>
<div id="grid" class="grid"></div>
</main>

<dialog id="editDlg"><div class="modal"><h2 id="title"></h2><div class="form">
<label>表面の写真</label><input id="front" type="file" accept="image/*" onchange="preview('front','frontPrev')"><img id="frontPrev" class="photoPreview" hidden>
<label>裏面の写真</label><input id="back" type="file" accept="image/*" onchange="preview('back','backPrev')"><img id="backPrev" class="photoPreview" hidden>
<label>タイプ</label><select id="fType"><option value="">未設定</option><option>キュート</option><option>クール</option><option>セクシー</option><option>ポップ</option></select>
<label>ブランド</label><select id="fBrand"><option value="">未設定</option><option>ノーブランド</option><option>エンジェリーシュガー</option><option>フューチャリングガール</option><option>スパイシーアゲハ</option><option>ドリーミークラウン</option><option>メープルリボン</option></select>
<label>カテゴリ</label><select id="fCat"><option value="">未設定</option><option>トップス</option><option>ボトムス</option><option>シューズ</option><option>トップス＆ボトムス</option><option>フルコーデ</option><option>アクセサリー</option></select>
<label>所持枚数</label><input id="fQty" type="number" min="0" step="1" value="0">
<label>パラレル</label><select id="fParallel"><option value="false">通常</option><option value="true">パラレル</option></select>
<label>メモ</label><input id="fMemo" placeholder="自由にメモ">
</div><p class="hint">カード番号・カード名・レア度は公開カード情報をもとに初期登録しています。タイプ・ブランド・カテゴリは、確実な情報を確認してから自動で埋められるよう、現状は編集式にしています。</p>
<div class="foot"><button onclick="editDlg.close()">キャンセル</button><button class="primary" onclick="saveCard()">保存</button></div></div></dialog>

<dialog id="importDlg"><div class="modal"><h2>バックアップ／取り込み</h2><p class="hint">このアプリから出したJSONを読み込むと、所持状況や写真・メモを復元できます。</p><input id="file" type="file" accept=".json" onchange="importJSON()"><div class="foot"><button onclick="importDlg.close()">閉じる</button></div></div></dialog>

function render(){

function edit(id){const x=cards.find(c=>c.id===id);editId=id;$("title").textContent=x.no+"　"+x.name;$("fType").value=x.type||"";$("fBrand").value=x.brand||"";$("fCat").value=x.category||"";$("fQty").value=x.qty||0;$("fParallel").value=String(!!x.parallel);$("fMemo").value=x.memo||"";for(const [inp,prev,val] of [["front","frontPrev",x.photo],["back","backPrev",x.backPhoto]]){$(inp).value="";$(prev).hidden=!val;if(val)$(prev).src=val}editDlg.showModal()}

async function saveCard(){const x=cards.find(c=>c.id===editId);x.type=$("fType").value;x.brand=$("fBrand").value;x.category=$("fCat").value;x.qty=Math.max(0,parseInt($("fQty").value||0));x.owned=x.qty>0;x.parallel=$("fParallel").value==="true";x.memo=$("fMemo").value;x.photo=await readFile($("front").files[0])||x.photo;x.backPhoto=await readFile($("back").files[0])||x.backPhoto;save();editDlg.close();render()}

function sortBy(x){order=x;render()}
function openImport(){importDlg.showModal()}
function exportJSON(){const blob=new Blob([JSON.stringify(cards,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="aikatsu-encore-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(){const f=$("file").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;cards=d;save();importDlg.close();render();alert("復元しました！")}catch(e){alert("JSONを読み込めませんでした。")}};r.readAsText(f)}
